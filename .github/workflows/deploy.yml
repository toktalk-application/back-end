name: Java CI with Gradle

on:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Convert gradlew to Unix line endings
        run: |
          sed -i 's/\r$//' gradlew  
      - name: Create Firebase Config
        run: |
            cat > src/main/resources/firebase/toktalk-app-firebase-adminsdk-4d2no-8c8b3e32e8.json << EOF
            {
              "type": "service_account",
              "project_id": "toktalk-app",
              "private_key_id": "${{ secrets.FIREBASE_KEY_ID }}",
              "private_key": "${{ secrets.FIREBASE_KEY }}",
              "client_email": "${{ secrets.CLIENT_EMAIL }}",
              "client_id": "${{ secrets.CLIENT_ID }}",
              "auth_uri": "${{ secrets.AUTH_URI }}",
              "token_uri": "${{ secrets.TOKEN_URI }}",
              "auth_provider_x509_cert_url": "${{ secrets.AUTH_PROVIDER_URL }}",
              "client_x509_cert_url": "${{ secrets.CLIENT_URL }}",
              "universe_domain": "${{ secrets.UNIVERSE_DOMAIN }}"
            }
            EOF
      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker build
        run: |
          docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_PASSWORD }}
          docker build -t toktalk .
          docker tag toktalk kokyungbum/toktalk:${GITHUB_SHA::7}
          docker push kokyungbum/toktalk:${GITHUB_SHA::7}

      # AWS credentials configuration
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Start Session Manager session
        run: aws ssm start-session --target i-05ee53499ed8f891d

      - name: Deploy to Server
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
        run: |
          aws ssm send-command \
            --instance-ids i-05ee53499ed8f891d \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'if sudo docker ps -a --format \\'{{.Names}}\\' | grep -q \\'^server$\\'; then',
              '  sudo docker stop server',
              '  sudo docker rm server',
              'fi',
              'sudo docker pull kokyungbum/toktalk:${GITHUB_SHA::7}',
              'sudo docker tag kokyungbum/toktalk:${GITHUB_SHA::7} toktalk',
              'sudo docker run -d --name server -p 8080:8080 \\
          -e SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }} \\
          -e SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \\
          -e SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \\
          -e CODEF_CLIENT_ID=${{ secrets.CODEF_CLIENT_ID }} \\
          -e CODEF_CLIENT_SECRET=${{ secrets.CODEF_CLIENT_SECRET }} \\
          -e JWT_KEY=${{ secrets.JWT_KEY }} \\
          -e TOSS_CLIENT_KEY=${{ secrets.TOSS_CLIENT_KEY }} \\
          -e TOSS_SECRET_KEY=${{ secrets.TOSS_SECRET_KEY }} \\
          -e AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \\
          -e AWS_ACCESS_SECRET_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \\
          -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \\
          toktalk'
            ]" \
            --output text