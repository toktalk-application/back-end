name: Java CI with Gradle

on:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Convert gradlew to Unix line endings
        run: |
          sed -i 's/\r$//' gradlew  

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker build
        run: |
          docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_PASSWORD }}
          docker build -t toktalk .
          docker tag toktalk kokyungbum/toktalk:${GITHUB_SHA::7}
          docker push kokyungbum/toktalk:${GITHUB_SHA::7}

      # AWS credentials configuration
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Start Session Manager session
        run: aws ssm start-session --target i-05ee53499ed8f891d

      - name: Deploy to Server
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
          FIREBASE_KEY_ID: ${{ secrets.FIREBASE_KEY_ID }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          AUTH_URI: ${{ secrets.AUTH_URI }}
          TOKEN_URI: ${{ secrets.TOKEN_URI }}
          AUTH_PROVIDER_URL: ${{ secrets.AUTH_PROVIDER_URL }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}
        run: |
          aws ssm send-command \
            --instance-ids i-05ee53499ed8f891d \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'echo \"Creating Firebase service account JSON...\"',
              'cat <<EOF > /path/to/firebase/toktalk-app-firebase-adminsdk-4d2no-8c8b3e32e8.json',
              '{',
              '  \"type\": \"service_account\",',
              '  \"project_id\": \"toktalk-app\",',
              '  \"private_key_id\": \"${FIREBASE_KEY_ID}\",',
              '  \"private_key\": \"${FIREBASE_KEY}\",',
              '  \"client_email\": \"${CLIENT_EMAIL}\",',
              '  \"client_id\": \"${CLIENT_ID}\",',
              '  \"auth_uri\": \"${AUTH_URI}\",',
              '  \"token_uri\": \"${TOKEN_URI}\",',
              '  \"auth_provider_x509_cert_url\": \"${AUTH_PROVIDER_URL}\",',
              '  \"client_x509_cert_url\": \"${CLIENT_URL}\",',
              '  \"universe_domain\": \"${UNIVERSE_DOMAIN}\"',
              '}',
              'EOF',

              'if sudo docker ps -a --format \\'{{.Names}}\\' | grep -q \\'^server$\\'; then',
              '  sudo docker stop server',
              '  sudo docker rm server',
              'fi',
              'sudo docker pull kokyungbum/toktalk:${GITHUB_SHA::7}',
              'sudo docker tag kokyungbum/toktalk:${GITHUB_SHA::7} toktalk',
              'sudo docker run -d --name server -p 8080:8080 \\',
              '  -e SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL} \\',
              '  -e SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME} \\',
              '  -e SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD} \\',
              '  -e CODEF_CLIENT_ID=${CODEF_CLIENT_ID} \\',
              '  -e CODEF_CLIENT_SECRET=${CODEF_CLIENT_SECRET} \\',
              '  -e JWT_KEY=${JWT_KEY} \\',
              '  -e TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY} \\',
              '  -e TOSS_SECRET_KEY=${TOSS_SECRET_KEY} \\',
              '  -e AWS_ACCESS_KEY=${AWS_ACCESS_KEY} \\',
              '  -e AWS_ACCESS_SECRET_KEY=${AWS_SECRET_ACCESS_KEY} \\',
              '  -e AWS_S3_BUCKET=${AWS_S3_BUCKET} \\',
              '  toktalk'
            ]" \
            --output text
